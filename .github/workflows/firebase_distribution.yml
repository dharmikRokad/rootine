name: Firebase Distribution

on:
  push:
    branches:
      - main

jobs:
  build-and-distribute:
    name: Build & Distribute to Firebase
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java ─────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Set up Flutter ──────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # # ── 5. Create .env file ───────────────────────────────────────────────
      # - name: Create .env file
      #   run: |
      #     echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      # # ── 6. Decode & place the keystore ─────────────────────────────────────
      # - name: Decode keystore
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      # # ── 7. Create key.properties ───────────────────────────────────────────
      # - name: Create key.properties
      #   run: |
      #     cat <<EOF > android/key.properties
      #     storePassword=${{ secrets.KEYSTORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=keystore.jks
      #     EOF

      # ── 8. Build release APK ───────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── 9. Decode Firebase service account ─────────────────────────────────
      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase-service-account.json

      # ── 10. Upload to Firebase App Distribution ────────────────────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
